language: "en"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "master"
      - "develop"
      - "recode"
  path_filters:
    - "!gradle/wrapper/gradle-wrapper.jar"
  path_instructions:
    - path: "**/*.java"
      instructions: |
        This is McCore, a plugin-agnostic framework library consumed by Minecraft
        plugins built on the Paper/Bukkit API.

        Accept the following patterns without flagging:
        - Generic type parameters (e.g., PlayerProfile, McPlugin,
          T extends McPlugin) are intentional API design. Do not suggest removing
          generics or simplifying the type hierarchy.
        - Async scheduling via BukkitRunnable, Bukkit.getScheduler(), or
          CompletableFuture chains is intentional. Do not flag as thread-safety issues.
        - Abstract base classes and interfaces with multiple type parameters are an
          intentional extensibility design — consumers bind the type parameters.
        - Events under com.diamonddagger590.mccore.event are framework events
          intended to be consumed by downstream plugins.

        Flag immediately:
        - Any class, method, or field that references a specific consumer plugin
          by name or imports from a consumer plugin package (e.g., us.eunoians.*).
          McCore must remain fully plugin-agnostic.

        Deprioritize primary review of API extension points and test structure;
        if persona automation is unavailable or skipped, include these domains
        in the review.
    - path: "src/test/**/*.java"
      instructions: |
        Test naming convention — do NOT flag as violations:

        - Method names use: methodUnderTest_expectedOutcome_whenCondition
          Example: getStatistic_returnsStatistic_whenKeyIsRegistered
        - @DisplayName uses: "Given [precondition], when [action], then [expected outcome]"
          Example: @DisplayName("Given a registered statistic, when getting by key, then returns the statistic")

        The Given/When/Then pattern is ONLY for @DisplayName annotations, NOT for
        method names. Do not suggest renaming methods to givenX_whenY_thenZ — that
        is incorrect for this project. The method naming convention is
        methodUnderTest_expectedOutcome_whenCondition.

        Bukkit Event classes (HandlerList, NamespacedKey, etc.) from Paper API work
        in plain JUnit tests without MockBukkit. Do not flag the absence of
        MockBukkit setup/teardown for tests that only construct events, check
        handler lists, or use NamespacedKey.fromString().

    - path: "src/test/**/*.java"
      instructions: |
        Test method naming convention for this repository is:
          methodUnderTest_expectedOutcome_whenCondition
        For example: register_throwsIllegalArgument_whenManagerAlreadyRegistered

        The @DisplayName annotation carries the Given/When/Then sentence:
          @DisplayName("Given a registered manager, when registering again, then throws IllegalArgumentException")

        Do NOT flag test method names that follow the methodUnderTest_expectedOutcome_whenCondition
        pattern. Do NOT suggest renaming them to givenContext_whenAction_thenOutcome — that is
        NOT the convention used in this repository.

    - path: "src/testFixtures/**/*.java"
      instructions: |
        Test fixture files follow the same naming conventions as test files.
        See the src/test path instructions for details.

chat:
  auto_reply: true
